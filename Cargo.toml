[package]
name = "selphy"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
gpui-kit = "0.7.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
indicatif = "0.18.6"
inquire = "0.9.4"
jpeg-encoder = "0.7.1"
moxcms = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

# Image code is 10-50x slower unoptimised. Optimise dependencies even in dev
# builds; our own crate stays fast to compile.
[profile.dev.package."*"]
opt-level = 3
