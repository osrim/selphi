name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release again, for example v0.1.0
        required: true
        type: string

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: macos-latest # arm64
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # No cache: a cache written by another run must never feed a release.
      - name: Install Rust from mise.toml
        run: |
          version=$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' mise.toml)
          rustup toolchain install "$version" --profile minimal
          rustup default "$version"

      - name: Check that Cargo.toml matches the tag
        run: |
          id=$(cargo pkgid -p selphi-gui)
          version=${id##*[#@]}
          if [ "v$version" != "$TAG" ]; then
            echo "Cargo.toml is $version, tag is $TAG" >&2
            exit 1
          fi

      # The release job builds nothing, so the suite runs here, without secrets.
      - run: cargo test --workspace --locked
      - run: scripts/bundle-app.sh dist

      - name: Smoke test the bundle
        run: |
          app=dist/selphi.app
          "$app/Contents/MacOS/selphi" --version | grep -Fx "selphi-cli ${TAG#v}"
          test -s "$app/Contents/Resources/completions/_selphi"
          plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist" | grep -Fx "${TAG#v}"
          test -x "$app/Contents/MacOS/selphi-gui"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selphi-darwin-arm64
          path: dist/selphi-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # This job holds the release token and the tap key, so it runs only
      # the repo's own shell scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: selphi-darwin-arm64
          path: dist
      - name: Write checksums
        run: cd dist && sha256sum selphi-darwin-arm64.zip > checksums.txt && cat checksums.txt

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/selphi-darwin-arm64.zip dist/checksums.txt --clobber
            exit 0
          fi
          args=()
          case "$TAG" in *-*) args+=(--prerelease);; esac
          gh release create "$TAG" dist/selphi-darwin-arm64.zip dist/checksums.txt \
            "${args[@]}" --title "$TAG" --generate-notes

      # Last: the asset must be public before the cask points at it.
      - name: Update the Homebrew tap
        if: ${{ !contains(env.TAG, '-') }}
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          key="$RUNNER_TEMP/tap-deploy"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          tap="$RUNNER_TEMP/tap"
          git clone --depth 1 git@github.com:osrim/homebrew-tap.git "$tap"
          mkdir -p "$tap/Casks"
          scripts/brew-cask.sh "${TAG#v}" dist/checksums.txt > "$tap/Casks/selphi.rb"

          cd "$tap"
          git add Casks/selphi.rb
          if git diff --cached --quiet; then
            echo "Casks/selphi.rb unchanged, nothing to push"
          else
            git -c user.name=github-actions[bot] \
                -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
                commit -m "selphi $TAG"
            git push
          fi
